# The M0 Windows spike (MILESTONES §6, M0 step 5) on GitHub's Windows Server 2022 (Windows 10's code base) and
# 2025 (Windows 11's), as administrator. Runs when the spike changes on dev, or by hand. The reports are in the
# run's summary and artifacts; the lab computer's long run is done by hand (spikes/windows/README.md).
name: spike
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['spikes/windows/**', '.github/workflows/spike.yml']
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Download the Electron binary, up to 3 tries
        shell: bash
        run: for i in 1 2 3; do node node_modules/electron/install.js && exit 0; sleep 15; done; exit 1
      - run: node spikes/windows/run-all.mjs
      - name: The report in the summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Get-Content spikes/windows/out/*-report.md | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: spike-${{ matrix.os }}
          path: spikes/windows/out/
