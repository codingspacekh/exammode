# The windows tests alone (MILESTONES §3: real Windows, never only the fake), on GitHub's Windows Server 2022
# (Windows 10's code base) and 2025 (Windows 11's), as administrator: quicker than the whole check when only the
# Windows side changed. The whole check still runs them too (ci.yml).
name: windows
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['src/win/**', 'src/guard/**', 'src/lib/lockdown/**', 'src/lib/guard/**', 'src/main/shell/**', 'src/main/student/**', 'tests/windows/**', 'tests/e2e/lock.spec.ts', '.github/workflows/windows.yml']
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run --project windows --silent=false
      # the built app and the built Guard lock this computer and put it back
      - name: Download the Electron binary, up to 3 tries
        shell: bash
        run: for i in 1 2 3; do node node_modules/electron/install.js && exit 0; sleep 15; done; exit 1
      - run: npm run build
      # If a test leaves this computer locked, GitHub loses it and its log with it. So, whatever happens: after
      # 6 minutes the firewall lets everything out again and Explorer is started.
      - name: A safety net for the lock tests
        shell: pwsh
        run: Start-Process powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-Command','Start-Sleep 360; netsh advfirewall set allprofiles firewallpolicy blockinbound,allowoutbound; Start-Process explorer.exe'
      - name: The lock test — locked, an app of the exam, an app closed, handed in, put back
        run: npx playwright test tests/e2e/lock.spec.ts -g "put back after the hand-in"
        timeout-minutes: 8
      - name: The lock test — ExamMode killed
        if: ${{ !cancelled() }}
        run: npx playwright test tests/e2e/lock.spec.ts -g "killed during the exam"
        timeout-minutes: 8
