<div class="xbar">
  <div class="brand">{{include:logo}}<b>Exam<span>Mode</span></b></div>
  <span class="xtag">{{i:lock:s12}} EXAM</span>
  <div class="xwho"><b>Year 10 ICT — Term 1 practical exam</b><span>Sokha Chan · PC-14 · set by Ms Srey Leak</span></div>
  <div class="xsep"></div>
  <div class="xtabs">
    <button class="xtab {{TQ}}"><span class="ai web">{{i:questions:s12}}</span>Questions</button>
    <button class="xtab {{TW}}"><span class="ai word">W</span>Word{{RW|<i class="run"></i>}}</button>
    <button class="xtab {{TX}}"><span class="ai excel">X</span>Excel{{RX}}</button>
    <button class="xtab {{TV}}"><span class="ai vscode">{{i:code:s12}}</span>VS Code{{RV}}</button>
  </div>
  <span class="spacer"></span>
  <span class="xconn {{CONNC}}"><i></i>{{CONN|Connected}}</span>
  <div class="xsep"></div>
  <div class="xclock {{CLOCKC}}"><b>{{CLOCK|1:12:40}}</b><span>{{CLOCKL|left · ends 11:00}}</span></div>
  <div class="xsep"></div>
  <button class="xbtn {{FILESC}}">{{i:folder:s14}} Exam folder</button>
  <button class="xbtn primary">{{i:upload:s14}} Hand in…</button>
  <button class="xbtn icon {{MOREC}}" title="More">{{i:more}}</button>
</div>
